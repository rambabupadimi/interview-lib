<div class="technologies-section">

    <div class="technologies-left-section">
        <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline">
              <mat-label>Code</mat-label>
              <input matInput formControlName="code" required>
              <mat-error *ngIf="myForm.get('firstName')?.invalid && myForm.get('firstName')?.touched">
                Code name is required
              </mat-error>
            </mat-form-field>
            <br/>
            <mat-form-field appearance="outline">
              <mat-label>Name</mat-label>
              <input matInput formControlName="name" required>
              <mat-error *ngIf="myForm.get('code')?.invalid && myForm.get('code')?.touched">
                Name is required
              </mat-error>
            </mat-form-field>
            <br/>
            <mat-form-field appearance="outline">
              <mat-label>Description</mat-label>
              <input matInput formControlName="description" required>
              <mat-error *ngIf="myForm.get('description')?.invalid && myForm.get('description')?.touched">
              Description is required
               </mat-error>
            </mat-form-field>
            <br/>
          
            <button *ngIf="!isEdit" mat-stroked-button color="primary" type="submit" [disabled]="myForm.invalid">Add</button>
            <div *ngIf="isEdit">
              <button mat-stroked-button color="primary" type="button" (click)="onClose()" >Cancel</button>
              <button mat-stroked-button color="primary" type="submit" [disabled]="myForm.invalid">Update</button>

            </div>
          </form>
    </div>

    <div class="technologies-right-section">
        <app-technologies-list 
        [list] = "technologiesList"
        (deleteTechnologyEmitter)="onDeleteTechnology($event)"
        (editTechnologyEmitter)="onEditTechnology($event)"></app-technologies-list>

    </div>
   
</div>
